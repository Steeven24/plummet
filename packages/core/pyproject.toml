[project]
name = "plummet-core"
version = "0.1.0"
description = "Shared code for Plummet: database, scrapers and price logic"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plummet_core"]
