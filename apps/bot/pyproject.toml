[project]
name = "plummet-bot"
version = "0.1.0"
description = "Telegram bot that sends price alerts"
requires-python = ">=3.12"
dependencies = [
    "plummet-core",
    "python-telegram-bot>=21.0",
]

[tool.uv.sources]
plummet-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plummet_bot"]

[project.scripts]
plummet-bot = "plummet_bot.main:main"
