[project]
name = "plummet-api"
version = "1.0.0"
description = "REST API for the web dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "plummet-core",
    "uvicorn>=0.32",
]

[tool.uv.sources]
plummet-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plummet_api"]

[project.scripts]
plummet-api = "plummet_api.main:main"
